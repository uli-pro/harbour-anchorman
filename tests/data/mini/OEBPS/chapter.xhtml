<h2><a id="chap01"/><span id="chapter-s0">The Happy Prince.</span></h2>
<p><span id="chapter-s1"><span class="smcap">High</span> above the city, on a tall
column, stood the statue of the Happy Prince. </span><span id="chapter-s2">He was gilded
all over with thin leaves of fine gold, for eyes he had two
bright sapphires, and a large red ruby glowed on his
sword-hilt.</span></p>
